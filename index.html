  <title>Millennium Central Downtown | Digital Promotions</title>

  <style>
    :root{
       --teal:#559f9f;
       --teal-dark:#2f7778;
       --teal-soft:#eaf5f5;
       --ink:#24445b;
       --muted:#6f8493;
       --bg:#eef1f4;
       --white:#ffffff;
       --line:#e8edf0;
       --tab:#f6f7f8;
       --shadow:0 8px 22px rgba(25,47,66,.09);
       --radius:12px;
       --header-h:60px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:auto;overflow-y:auto}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color:#ffffff;
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
      -webkit-overflow-scrolling:touch;
    }
    body.modal-open{overflow:hidden}
    button,input{font:inherit}
    button{color:inherit}
    img{display:block;max-width:100%}

    .app{
      width:min(100%, 520px);
      min-height:100vh;
      margin:0 auto;
      background:var(--white);
      overflow:visible;
      box-shadow:0 0 50px rgba(0,0,0,.05);
    }

    /* =========================================================
       TOP HEADER
       This is always sticky.
       ========================================================= */
    .sticky-stack{
      position:fixed;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:min(100%, 520px);
      z-index:999;
      background:rgba(255,255,255,.99);
      box-shadow:0 2px 10px rgba(25,47,66,.08);
    }

    .sticky-spacer{
      height:var(--sticky-stack-height, 60px);
    }

    .topbar{
      position:relative;
      z-index:2;
      min-height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      padding:9px 17px;
      background:rgba(255,255,255,.98);
      border-bottom:1px solid rgba(232,237,240,.9);
      backdrop-filter:blur(12px);
    }

    .header-side{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .round-btn{
      width:39px;
      height:39px;
      flex:0 0 39px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:50%;
      background:#d71920;
      color:#ffffff;
      cursor:pointer;
      transition:transform .16s ease, background .16s ease;
    }

    .round-btn:hover{background:#b8141a}
    .round-btn:focus-visible{outline:3px solid rgba(215,25,32,.20);outline-offset:2px;background:#c5161d}
    .round-btn:active{transform:scale(.96);background:#931015}

    .round-btn .translation-icon{
      display:block;
      width:29px;
      height:29px;
      object-fit:contain;
    }

    .round-btn .phone-icon{
      width:20px;
      height:20px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* =========================================================
       HERO IMAGE
       It scrolls normally and is NOT sticky.
       To replace it, add hero.jpg to asset/ or assets/
       ========================================================= */
    .hero-wrap{
      padding:0 17px;
      background:#fff;
    }
    .hero{
      position:relative;
      overflow:hidden;
      width:100%;
      aspect-ratio:1.55 / 1;
      border-radius:14px;
      background:linear-gradient(135deg,#dce8e8,#b9cece);
    }
    .hero img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .promotions-content{
      padding:0 17px 32px;
      overflow:visible;
    }

    .promotions-section{
      padding-top:42px;
      scroll-margin-top:calc(var(--sticky-stack-height, 60px) + 12px);
    }

    .section-title{
      margin:0 0 18px;
      font-size:1.18rem;
      line-height:1.2;
      font-weight:800;
      letter-spacing:-.01em;
      color:var(--ink);
    }

    .product-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:18px 18px;
    }

    .product-card{
      min-width:0;
      overflow:hidden;
      border-radius:7px;
      background:#fff;
      box-shadow:var(--shadow);
      cursor:pointer;
      border:1px solid rgba(232,237,240,.8);
      transition:transform .16s ease, box-shadow .16s ease;
    }
    .product-card:active{transform:scale(.992)}

    .product-image{
      position:relative;
      aspect-ratio:1.17 / 1;
      overflow:hidden;
      background:#dfe7e8;
    }
    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .product-body{
      padding:12px 11px 13px;
    }

    .product-name{
      margin:0;
      font-size:.93rem;
      line-height:1.28;
      font-weight:500;
      color:var(--ink);
      display:block;
      width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .dietary{
      min-height:0;
      margin:2px 0 0;
      color:#8ea0ad;
      font-size:.71rem;
      line-height:1.25;
      font-style:italic;
    }

    .product-desc{
      margin:5px 0 0;
      min-height:0;
      color:#617d91;
      font-size:.78rem;
      line-height:1.45;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .price-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:5px;
    }

    .price{
      font-size:.82rem;
      font-weight:750;
      color:var(--ink);
    }


    .old-price{
      color:#a0abb2;
      font-size:.76rem;
      text-decoration:line-through;
    }

    .custom-badge{
      display:inline-flex;
      margin-top:8px;
      padding:4px 7px;
      border-radius:999px;
      background:var(--teal-soft);
      color:var(--teal-dark);
      font-size:.64rem;
      font-weight:800;
    }

    .no-results{
      display:none;
      padding:40px 20px 90px;
      text-align:center;
      color:var(--muted);
    }
    .no-results.show{display:block}

/* =========================================================
       BOTTOM SHEETS
       ========================================================= */
    .overlay{
      position:fixed;
      inset:0;
      z-index:120;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(18,34,47,.46);
    }
    .overlay.open{display:flex}

    .sheet{
      width:min(100%,520px);
      max-height:88vh;
      overflow-y:auto;
      background:#fff;
      border-radius:22px 22px 0 0;
      box-shadow:0 -18px 50px rgba(0,0,0,.22);
      padding-bottom:max(16px,env(safe-area-inset-bottom));
      overscroll-behavior:contain;
    }

    .sheet-handle{
      width:42px;
      height:4px;
      margin:9px auto 3px;
      border-radius:999px;
      background:#d7dde0;
    }

    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 16px 12px;
      border-bottom:1px solid var(--line);
    }
    .sheet-head h2{
      margin:0;
      font-size:1.05rem;
    }
    .close-btn svg{stroke:#111111;}

    .close-btn{
       width:34px;
       height:34px;
       padding:0;
       border:0;
       outline:none;
       box-shadow:none;
       appearance:none;
       -webkit-appearance:none;
       border-radius:50%;
       background:#f1f4f5;
       color:#111111;
       font-size:1.15rem;
       line-height:1;
       cursor:pointer;
       display:grid;
       place-items:center;
    }
    .close-btn:focus,
    .close-btn:focus-visible{
       outline:none;
       box-shadow:none;
    }

    .language-list{
      display:grid;
      gap:8px;
      padding:14px;
    }

    .language-option{
       width:100%;
       display:flex;
       align-items:center;
       justify-content:space-between;
       gap:12px;
       border:1px solid #e8edf0;
       border-radius:11px;
       background:#ffffff;
       padding:13px 14px;
       text-align:start;
       cursor:pointer;
    }

    .language-option{color:#24445b;}

    .language-option.active{
       border-color:#d71920;
       background:#fff0f0;
       color:#24445b;
     }

    .language-option span:first-child{
      font-weight:700;
    }

    .check{
       color:#d71920;
       font-weight:900;
    }

    .detail-image{
      width:100%;
      aspect-ratio:1.4 / 1;
      overflow:hidden;
      background:#dfe7e8;
    }
    .detail-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .detail-content{
      padding:16px;
    }
    .detail-category{
      color:#d71920;
      font-size:.70rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.05em;
    }
    .detail-content h2{
      margin:6px 0;
      font-size:1.3rem;
      line-height:1.2;
    }
    .detail-price{
      font-size:.95rem;
      font-weight:850;
    }
    .detail-desc{
      margin:12px 0 0;
      color:#657f91;
      font-size:.88rem;
      line-height:1.55;
    }
    /* Offer validity, timings and venue: displayed only in product popups. */
    .offer-details{
      display:grid;
      gap:10px;
      margin-top:18px;
      padding-top:16px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:.86rem;
      line-height:1.5;
    }
    .offer-detail-row{
      display:flex;
      align-items:baseline;
      flex-wrap:wrap;
      gap:5px;
    }
    .offer-detail-row strong{
      color:var(--ink);
      font-weight:750;
    }

    .modifier{
      margin-top:15px;
      padding-top:13px;
      border-top:1px solid var(--line);
    }
    .modifier h3{
      margin:0 0 5px;
      font-size:.78rem;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .modifier p{
      margin:0;
      color:#6d8290;
      font-size:.85rem;
      line-height:1.5;
    }

/* Product popup text theme adjustment */
    .sheet,
    .sheet h2,
    .detail-content h2,
    .detail-price,
    .modifier h3,
    .sheet-head h2{
      color:var(--ink);
    }

    .detail-desc{
      color:var(--muted);
    }

    .modifier p{
      color:var(--muted);
    }

    @media (min-width:680px){
      body{padding:18px 0}
      .app{border-radius:22px}
      .sticky-stack{
        top:0;
        border-radius:0 0 16px 16px;
      }
      .product-grid{gap:20px}
      .overlay{align-items:flex-end;padding:0}
      .sheet{border-radius:22px 22px 0 0}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        scroll-behavior:auto!important;
        transition:none!important;
      }
    }

</style>
</head>

    },
    "ru": {
      "name": "Быстрый бизнес-ланч",
      "desc": "Бизнес-ланч без лишних хлопот: закуска, основное блюдо и напиток, чтобы зарядиться энергией на весь день."
    },
    "zh": {
      "name": "快捷商务午餐",
      "desc": "商务午餐，简单又省心。包含前菜、主菜及一杯饮品，为接下来的工作补充能量。"
    }
  },
  {
    "id": "offer-5",
    "image": "offer 5.jpg",
    "cat": "non-alcoholic-promotions",
    "price": "69.00",
    "en": {
      "name": "Dinner Buffet",
      "desc": "Enjoy a delicious dinner buffet featuring a selection of starters, refreshing juices, hearty main courses, and tempting desserts."
    },
    "ar": {
      "name": "بوفيه العشاء",
      "desc": "استمتع ببوفيه عشاء شهي يضم تشكيلة من المقبلات والعصائر المنعشة والأطباق الرئيسية الغنية والحلويات الشهية."
    },
    "ru": {
      "name": "Шведский стол на ужин",
      "desc": "Насладитесь вкусным ужином в формате шведского стола с выбором закусок, освежающих соков, сытных основных блюд и аппетитных десертов."
    },
    "zh": {
      "name": "自助晚餐",
      "desc": "尽情享用丰盛的自助晚餐，包括精选前菜、清爽果汁、丰盛主菜及诱人甜点。"
    }
  },
  {
    "id": "offer-6",
    "image": "offer 6.jpg",
    "cat": "non-alcoholic-promotions",
    "price": "99.00",
    "en": {
      "name": "Chef’s Table Experience",
      "desc": "An Evening at the Chef’s Table. Experience three carefully crafted courses, showcasing the chef’s selection of flavours and culinary creativity."
    },
    "ar": {
      "name": "تجربة مائدة الشيف",
      "desc": "أمسية على مائدة الشيف. استمتع بثلاثة أطباق أُعدّت بعناية، تعكس نكهات الشيف المختارة وإبداعه في فن الطهي."
    },
    "ru": {
      "name": "Гастрономический вечер за столом шеф-повара",
      "desc": "Вечер за столом шеф-повара. Откройте для себя три тщательно продуманных блюда, раскрывающих авторское сочетание вкусов и кулинарное мастерство шеф-повара."
    },
    "zh": {
      "name": "主厨餐桌体验",
      "desc": "主厨餐桌之夜。品尝精心打造的三道式佳肴，领略主厨甄选的风味与独特烹饪创意。"
    }
  }
];

  const categoryOrder = ["alcoholic-promotion", "non-alcoholic-promotions"];

  let currentLang = localStorage.getItem("kow-promotions-lang") || "en";
  if(!["en","ar","ru","zh"].includes(currentLang)) currentLang = "en";

  const promotionsContent = document.getElementById("promotionsContent");
  const noResults = document.getElementById("noResults");

  function esc(v=""){
    return String(v).replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      "\"":"&quot;","'":"&#039;"
    }[m]));
  }

  // Resolve image files against common folders and filenames.
  // This avoids broken images when the folder is named "asset" instead of
  // "assets", or the uploaded image is named "offer1.jpg" vs "offer 1.jpg".
  function imageCandidates(filename){
    const match = /^offer[\s_-]*(\d+)\.(jpe?g|png|webp)$/i.exec(filename);
    const names = match
      ? [`offer ${match[1]}`, `offer${match[1]}`, `offer-${match[1]}`, `offer_${match[1]}`]
      : [filename.replace(/\.(jpe?g|png|webp)$/i, "")];
    const suppliedExt = (filename.match(/\.([^.]+)$/) || [,"jpg"])[1].toLowerCase();
    const exts = [...new Set([suppliedExt, "jpg", "jpeg", "png", "webp"])] ;
    const dirs = ["assets", "asset", "assets/promotions", "asset/promotions"];
    const paths = [];
    for(const name of names){
      for(const ext of exts){
        for(const dir of dirs){
          paths.push(`./${dir}/${encodeURIComponent(name + "." + ext)}`);
        }
      }
    }
    return paths;
  }

  // Always show a helpful placeholder even when placeholder.svg is not uploaded.
  const EMBEDDED_IMAGE_PLACEHOLDER = "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"><rect width="600" height="400" fill="#e7edf1"/><path d="M180 270l90-100 65 70 35-40 75 70" stroke="#a7b7c1" fill="none" stroke-width="13" stroke-linejoin="round"/><circle cx="210" cy="135" r="21" fill="#a7b7c1"/><text x="300" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#708695">Image not found</text></svg>');

  function loadAssetImage(img, filename){
    if(!img) return;
    const paths = imageCandidates(filename);
    paths.push("./assets/placeholder.svg", "./asset/placeholder.svg");
    let position = 0;
    const tryNext = () => {
      if(position < paths.length){
        img.src = paths[position++];
      }else{
        img.removeEventListener("error", tryNext);
        img.src = EMBEDDED_IMAGE_PLACEHOLDER;
        console.warn("Missing image:", filename, "— check the filename, extension and asset/assets folder next to this HTML file.");
      }
    };
    img.addEventListener("error", tryNext);
    tryNext();
  }

  function money(value){
    const formatted = String(value).split("|").map(v=>`AED ${v.trim()}`).join(" | ");
    return formatted;
  }

  function renderPromotions(){
    let totalVisible = 0;

    promotionsContent.innerHTML = categoryOrder.map(cat=>{
      const items = PROMOTIONS.filter(item=>item.cat===cat);

      if(!items.length) return "";
      totalVisible += items.length;

      return `
        <section class="promotions-section" id="section-${cat}" data-section-cat="${cat}">
          <h2 class="section-title">${esc(CAT[cat][currentLang])}</h2>
          <div class="product-grid">
            ${items.map(productCard).join("")}
          </div>
        </section>
      `;
    }).join("");

    noResults.classList.toggle("show", totalVisible===0);

    promotionsContent.querySelectorAll("img[data-image-file]").forEach(img=>{
      loadAssetImage(img, img.dataset.imageFile);
    });

    promotionsContent.querySelectorAll(".product-card").forEach(card=>{
      card.addEventListener("click",()=>openProduct(card.dataset.id));
      card.addEventListener("keydown",e=>{
        if(e.key==="Enter" || e.key===" "){
          e.preventDefault();
          openProduct(card.dataset.id);
        }
      });
    });

  }

  function productCard(item){
    const t = item[currentLang];
    return `
      <article class="product-card" data-id="${item.id}" tabindex="0" role="button">
        <div class="product-image">
          <img
            data-image-file="${esc(item.image)}"
            alt="${esc(t.name)}"
            loading="lazy"
          >
        </div>

        <div class="product-body">
          <h3 class="product-name">${esc(t.name)}</h3>
          <p class="dietary">${item.dietary ? esc(typeof item.dietary === "object" ? (item.dietary[currentLang] || "") : item.dietary) : ""}</p>
          ${t.desc ? `<p class="product-desc">${esc(t.desc)}</p>` : `<p class="product-desc">&nbsp;</p>`}
          ${item.badge ? `<span class="custom-badge">${esc(UI[currentLang].custom)}</span>` : ""}
          <div class="price-row">
            <span class="price">${money(item.price)}</span>
            ${item.oldPrice ? `<span class="old-price">${money(item.oldPrice)}</span>` : ""}
          </div>
        </div>
      </article>
    `;
  }

  function openProduct(id){
    const item = PROMOTIONS.find(x=>x.id===id);
    if(!item) return;

    const t = item[currentLang];
    const details = OFFER_DETAILS[currentLang];

    const modifiers = item.modifiers
      ? item.modifiers[currentLang].map(m=>`
          <div class="modifier">
            <h3>${esc(m[0])}</h3>
            <p>${esc(m[1])}</p>
          </div>
        `).join("")
      : "";

    document.getElementById("detailBody").innerHTML = `
      <div class="detail-image">
        <img
          data-image-file="${esc(item.image)}"
          alt="${esc(t.name)}"
        >
      </div>

      <div class="detail-content">
        <div class="detail-category">${esc(CAT[item.cat][currentLang])}</div>
        <h2>${esc(t.name)}</h2>
        <div class="detail-price">${money(item.price)}</div>
        ${t.desc ? `<p class="detail-desc">${esc(t.desc)}</p>` : ""}
        ${modifiers}
        <div class="offer-details" aria-label="Offer details">
          <div class="offer-detail-row"><strong>${esc(details.validityLabel)}:</strong> <span>${esc(details.validity)}</span></div>
          <div class="offer-detail-row"><strong>${esc(details.timeLabel)}:</strong> <span>${esc(details.time)}</span></div>
          <div class="offer-detail-row"><strong>${esc(details.locationLabel)}:</strong> <span>${esc(details.location)}</span></div>
        </div>
      </div>
    `;

    const detailImage = document.querySelector("#detailBody img[data-image-file]");
    loadAssetImage(detailImage, item.image);
    openOverlay("detailOverlay");
  }

  function setLanguage(lang){
    currentLang = lang;
    localStorage.setItem("kow-promotions-lang",lang);

    document.documentElement.lang = lang;
    document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-ui]").forEach(el=>{
      const key = el.dataset.ui;
      if(UI[lang][key]) el.textContent = UI[lang][key];
    });
    noResults.textContent = UI[lang].noResults;

    document.querySelectorAll(".language-option").forEach(btn=>{
      const active = btn.dataset.lang===lang;
      btn.classList.toggle("active",active);
      btn.querySelector(".check").textContent = active ? "✓" : "";
    });

    renderPromotions();
    closeOverlay("languageOverlay");
  }

  function closeAllOverlays(exceptId=null){
    document.querySelectorAll(".overlay.open").forEach(overlay=>{
      if(overlay.id !== exceptId){
        overlay.classList.remove("open");
      }
    });

    if(!document.querySelector(".overlay.open")){
      document.body.classList.remove("modal-open");
    }
  }

  function openOverlay(id){
    const target = document.getElementById(id);
    if(!target) return;

    // Only one bottom popup can be open at a time.
    closeAllOverlays(id);
    target.classList.add("open");
    document.body.classList.add("modal-open");
  }

  function toggleOverlay(id){
    const target = document.getElementById(id);
    if(!target) return;

    if(target.classList.contains("open")){
      target.classList.remove("open");

      if(!document.querySelector(".overlay.open")){
        document.body.classList.remove("modal-open");
      }
      return;
    }

    // Opening a different popup automatically closes the current one.
    closeAllOverlays();
    target.classList.add("open");
    document.body.classList.add("modal-open");
  }

  function closeOverlay(id){
    const el = document.getElementById(id);
    if(el) el.classList.remove("open");

    if(!document.querySelector(".overlay.open")){
      document.body.classList.remove("modal-open");
    }
  }


  document.getElementById("languageBtn").addEventListener("click",()=>toggleOverlay("languageOverlay"));

  document.querySelectorAll(".language-option").forEach(btn=>{
    btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
  });

  document.querySelectorAll("[data-close]").forEach(btn=>{
    btn.addEventListener("click",()=>closeOverlay(btn.dataset.close));
  });

  document.querySelectorAll(".overlay").forEach(overlay=>{
    overlay.addEventListener("click",e=>{
      if(e.target===overlay) closeOverlay(overlay.id);
    });
  });

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      document.querySelectorAll(".overlay.open").forEach(o=>closeOverlay(o.id));
    }
  });


  function syncStickyStackHeight(){
    const stack = document.querySelector(".sticky-stack");
    if(!stack) return;

    const height = Math.ceil(stack.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--sticky-stack-height", height + "px");
  }

  // Keep the reserved space exactly equal to the fixed language header.
  syncStickyStackHeight();
  window.addEventListener("resize", syncStickyStackHeight);

  if("ResizeObserver" in window){
    const stickyResizeObserver = new ResizeObserver(syncStickyStackHeight);
    const stack = document.querySelector(".sticky-stack");
    if(stack) stickyResizeObserver.observe(stack);
  }

  loadAssetImage(document.getElementById("heroImage"), "hero.jpg");
  setLanguage(currentLang);
  requestAnimationFrame(syncStickyStackHeight);
</script>
